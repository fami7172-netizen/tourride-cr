# Supabase gratis pausa la base de datos si pasa una semana sin uso.
# Esto hace una consulta pequeña cada 3 días para que siga despierta.
name: Mantener Supabase despierto

on:
  schedule:
    - cron: '17 15 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el catálogo
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zaetkxctjcjetjrwhtti.supabase.co/rest/v1/app_data?select=key&limit=1" \
            -H "apikey: sb_publishable_5mk76a-c59sxAXp2Su8mqw_4QUplR6G")
          echo "Respuesta: $code"
          test "$code" = "200"
